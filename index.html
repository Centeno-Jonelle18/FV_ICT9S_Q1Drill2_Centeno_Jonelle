<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
<style>
section {
    background-color: #ffffff;
    	padding: 20px;
    	border-radius: 12px;
    	width: 600px;
    	margin: auto;
    	box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}
h1,p{
    	text-align: center;
    }
body{
font-family:'Courier New', Courier, monospace;
}
input[type="text"], select, textarea, input[type="submit"] {
    	width: 94%;
    	padding: 15px;
    	border: 1px solid #ccc;
    	border-radius: 5px;
    	text-align: center;
    }
input[type="submit"]{ 
cursor: pointer;
width: 100%;
}
</style>
    </head>
<body>
   <header>
    <h1>RATE A MOVIE</h1> 
<style>
    section{
    	background-color: #ffbe5d;
    	padding: 30px;
    	border-radius: 15px;
    	width: 700px;
    	margin: auto;
    }
</style>
   
       <br>

  <p> This webpage can let you review and rate any movie you desire, so go ahead!</p>
  
</header>
</style>
<br>
  <section>
  <form>
       <img style="display: block; height: 150px; width: 200px; margin: 0 auto;" src="https://png.pngtree.com/element_our/png/20181113/clapperboard-film-logo-icon-design-template-vector-isolated-png_236642.jpg" alt="logo">
   <br>
   <label for="movie"> Movie title</label>
 <br>
<input type="text" id="movie" name="movie" placeholder="Type here...">
<label for="genre">Genre/s</label> 
<br>
<input type="checkbox" id="genre1" name="genre1">
<label for="genre">Action</label>
<input type="checkbox" id="genre2" name="genre2">
<label for="genre">Horror</label>
<input type="checkbox" id="genre3" name="genre3">
<label for="genre">Fantasy</label>
<input type="checkbox" id="genre4" name="genre4">
<label for="genre">Comedy</label>
<input type="checkbox" id="genre5" name="genre5">
<label for="genre">Sci-fi</label>
<input type="checkbox" id="genre6" name="genre6">
<label for="genre">Romance</label>
<input type="checkbox" id="genre7" name="genre7">
<label for="genre">Other</label>
<br>
<label for="genre"> Rating</label>
<br>
<input type="radio" id="rate1" name="rate">
<label for "rate">⭐️</label>
<input type="radio" id="rate2" name="rate">
<label for "rate">⭐️⭐️</label>
<input type="radio" id="rate3" name="rate">
<label for "rate">⭐️⭐️⭐️</label>
<input type="radio" id="rate4" name="rate">
<label for "rate">⭐️⭐️⭐️⭐️</label>
<input type="radio" id="rate5" name="rate">
<label for "rate">⭐️⭐️⭐️⭐️⭐️</label>
<br>
<textarea id="review" placeholder="Write a review" rows="4" cols="40"></textarea>
<br>
<input type="submit" id="submit" value="Submit Review">
<br>
Click <a href="https://watch.plex.tv/" target="_blank">here</a> for more movie details.
</form>
  <p>Coded by: Jonelle Trizcia A. Centeno</p>
  </section>
</body>
<!--Reference https://pngtree.com/so/movie-logo-->
</html>
